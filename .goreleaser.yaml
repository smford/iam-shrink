version: 2

project_name: iam-shrink

before:
  hooks:
    - go mod tidy

builds:
  - id: iam-shrink
    main: ./cmd/iam-shrink
    binary: iam-shrink
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    builds:
      - iam-shrink
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*
      - action.yml

checksum:
  name_template: "checksums.txt"

brews:
  - repository:
      owner: smford
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/smford/iam-shrink"
    description: "Local-to-Least-Privilege AWS IAM Policy Generator"
    license: "MIT"
    commit_author:
      name: github-actions[bot]
      email: github-actions[bot]@users.noreply.github.com

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - Merge pull request
      - Merge branch
