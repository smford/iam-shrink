name: Feature Request
description: Suggest an idea or enhancement for iam-shrink
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome ideas for new output formats, compliance benchmark integrations, performance optimizations, or developer experience improvements!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or limitation you are experiencing.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or workarounds you've explored.
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - "New Output Format (IaC / Multi-Cloud)"
        - "Telemetry / Interception Engine (CSM / Proxy)"
        - "Compliance & Linters (CIS / NIST)"
        - "CI/CD & Developer Experience"
        - "Web UI / Visualizer"
        - "Other"
    validations:
      required: true
