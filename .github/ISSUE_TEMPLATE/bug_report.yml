name: Bug Report
description: Report an issue or unexpected behavior in iam-shrink
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and fix it quickly.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or commands to reproduce the issue.
      placeholder: |
        1. Run `iam-shrink run -- pytest tests/`
        2. Inspect output
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: command_output
    attributes:
      label: Terminal / CLI Output
      description: Paste any error messages, stack traces, or output logs here.
      render: shell
  - type: dropdown
    id: telemetry_mode
    attributes:
      label: Telemetry Mode Used
      options:
        - "Standard CSM (UDP 127.0.0.1)"
        - "Interception Proxy (--proxy)"
        - "CloudTrail Ingest (iam-shrink ingest)"
        - "Daemon Session (iam-shrink session)"
        - "Other / Not Applicable"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: iam-shrink Version
      description: Output of `iam-shrink version`
      placeholder: "0.6.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System & Architecture
      placeholder: "macOS 15.2 (arm64) / Ubuntu 24.04 (x86_64)"
    validations:
      required: true
