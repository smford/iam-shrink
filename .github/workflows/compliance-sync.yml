name: Compliance Standards Sync

on:
  schedule:
    # Run every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync CIS & NIST Compliance Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: true

      - name: Generate and Sync Compliance Rules
        run: |
          go run ./cmd/sync-compliance --out-dir=internal/compliance/embedded
          go test -v ./internal/compliance/...

      - name: Check for Compliance Changes
        id: git_status
        run: |
          git status --porcelain
          echo "has_changes=$(if [ -n "$(git status --porcelain)" ]; then echo "true"; else echo "false"; fi)" >> $GITHUB_OUTPUT

      - name: Commit and Push Updated Benchmark Rules to Main
        if: steps.git_status.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add internal/compliance/embedded/
          git commit -m "chore(compliance): automated sync of CIS v3 and NIST 800-53 standards"
          git push origin main
