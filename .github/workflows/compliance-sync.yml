name: Compliance Standards Sync

on:
  schedule:
    # Run every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync CIS & NIST Compliance Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Rule Verification
        run: |
          go test -v ./internal/compliance/...
          ./bin/iam-shrink version || true

      - name: Check for Compliance Changes
        id: git_status
        run: |
          git status --porcelain
          echo "has_changes=$(if [ -n "$(git status --porcelain)" ]; then echo "true"; else echo "false"; fi)" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.git_status.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          title: "chore(compliance): automated sync of CIS v3 and NIST 800-53 standards"
          commit-message: "chore(compliance): sync latest CIS & NIST rules"
          branch: "automated/compliance-sync"
          body: "Automated weekly sync verifying compliance definitions and baseline rule benchmarks."
