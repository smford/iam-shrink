  - service: DynamoDB
    api: Query
    actions:
      - dynamodb:Query
    resource_arns:
      - "arn:aws:dynamodb:${var.region}:${var.account_id}:table/${var.table_name}"
      - "arn:aws:dynamodb:${var.region}:${var.account_id}:table/${var.table_name}/index/*"
  - service: DynamoDB
    api: Scan
    actions:
      - dynamodb:Scan
    resource_arns:
      - "arn:aws:dynamodb:${var.region}:${var.account_id}:table/${var.table_name}"
      - "arn:aws:dynamodb:${var.region}:${var.account_id}:table/${var.table_name}/index/*"
  - service: DynamoDB
