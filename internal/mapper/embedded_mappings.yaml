  - service: KMS
    api: GenerateDataKey
    actions:
      - kms:GenerateDataKey
    resource_arns:
      - "arn:aws:kms:${var.region}:${var.account_id}:key/${var.key_id}"
  - service: KMS
    api: GenerateDataKeyWithoutPlaintext
    actions:
      - kms:GenerateDataKeyWithoutPlaintext
    resource_arns:
