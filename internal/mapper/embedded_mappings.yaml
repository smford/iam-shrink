    resource_arns:
      - "arn:aws:lambda:${var.region}:${var.account_id}:function:${var.function_name}"
  - service: Lambda
    api: GetFunction
    actions:
      - lambda:GetFunction
    resource_arns:
      - "arn:aws:lambda:${var.region}:${var.account_id}:function:${var.function_name}"
  - service: Lambda
    api: CreateFunction
    actions:
      - lambda:CreateFunction
    resource_arns:
      - "arn:aws:lambda:${var.region}:${var.account_id}:function:${var.function_name}"
    dependent_actions:
      - iam:PassRole
  - service: Lambda
    api: UpdateFunctionCode
    actions:
      - lambda:UpdateFunctionCode
    resource_arns:
      - "arn:aws:lambda:${var.region}:${var.account_id}:function:${var.function_name}"
  - service: Lambda
    api: UpdateFunctionConfiguration
