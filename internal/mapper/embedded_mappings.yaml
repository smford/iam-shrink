  - service: SSM
    api: GetParameters
    actions:
      - ssm:GetParameters
    resource_arns:
      - "arn:aws:ssm:${var.region}:${var.account_id}:parameter/${var.parameter_name}"
    dependent_actions:
      - kms:Decrypt
  - service: SSM
    api: GetParametersByPath
    actions:
      - ssm:GetParametersByPath
    resource_arns:
      - "arn:aws:ssm:${var.region}:${var.account_id}:parameter/${var.path}/*"
    dependent_actions:
      - kms:Decrypt
  - service: SSM
    api: PutParameter
    actions:
