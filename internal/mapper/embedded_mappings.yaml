# Default SDK-to-IAM Action Mappings
version: 1
mappings:
  # S3
  - service: S3
    api: ListObjectsV2
    actions:
      - s3:ListBucket
    resource_arns:
      - "arn:aws:s3:::${var.bucket_name}"
  - service: S3
    api: ListObjects
    actions:
      - s3:ListBucket
    resource_arns:
      - "arn:aws:s3:::${var.bucket_name}"
  - service: S3
    api: HeadBucket
    actions:
      - s3:ListBucket
    resource_arns:
      - "arn:aws:s3:::${var.bucket_name}"
  - service: S3
    api: GetObject
    actions:
      - s3:GetObject
    resource_arns:
      - "arn:aws:s3:::${var.bucket_name}/*"
  - service: S3
    api: HeadObject
    actions:
      - s3:GetObject
    resource_arns:
      - "arn:aws:s3:::${var.bucket_name}/*"
  - service: S3
    api: PutObject
    actions:
      - s3:PutObject
    resource_arns:
      - "arn:aws:s3:::${var.bucket_name}/*"
  - service: S3
    api: DeleteObject
    actions:
      - s3:DeleteObject
    resource_arns:
      - "arn:aws:s3:::${var.bucket_name}/*"
  - service: S3
    api: DeleteObjects
    actions:
      - s3:DeleteObject
    resource_arns:
      - "arn:aws:s3:::${var.bucket_name}/*"
  - service: S3
    api: GetBucketLocation
    actions:
      - s3:GetBucketLocation
    resource_arns:
      - "arn:aws:s3:::${var.bucket_name}"
  - service: S3
    api: CreateBucket
    actions:
      - s3:CreateBucket
    resource_arns:
      - "arn:aws:s3:::${var.bucket_name}"
  - service: S3
    api: DeleteBucket
    actions:
      - s3:DeleteBucket
    resource_arns:
      - "arn:aws:s3:::${var.bucket_name}"
  - service: S3
    api: CreateMultipartUpload
    actions:
      - s3:PutObject
    resource_arns:
      - "arn:aws:s3:::${var.bucket_name}/*"
  - service: S3
    api: UploadPart
    actions:
      - s3:PutObject
    resource_arns:
      - "arn:aws:s3:::${var.bucket_name}/*"
  - service: S3
    api: CompleteMultipartUpload
    actions:
      - s3:PutObject
    resource_arns:
      - "arn:aws:s3:::${var.bucket_name}/*"
  - service: S3
    api: AbortMultipartUpload
    actions:
      - s3:AbortMultipartUpload
    resource_arns:
      - "arn:aws:s3:::${var.bucket_name}/*"
  - service: S3
    api: UploadPartCopy
    actions:
      - s3:GetObject
      - s3:PutObject
    resource_arns:
      - "arn:aws:s3:::${var.bucket_name}/*"
  - service: S3
    api: GetObjectTagging
    actions:
      - s3:GetObjectTagging
    resource_arns:
      - "arn:aws:s3:::${var.bucket_name}/*"
  - service: S3
    api: PutObjectTagging
    actions:
      - s3:PutObjectTagging
    resource_arns:
      - "arn:aws:s3:::${var.bucket_name}/*"
  - service: S3
    api: ListBuckets
    actions:
      - s3:ListAllMyBuckets
    resource_arns:
      - "arn:aws:s3:::*"

  # DynamoDB
  - service: DynamoDB
