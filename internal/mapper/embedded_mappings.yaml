      - dynamodb:TransactGetItems
    resource_arns:
      - "arn:aws:dynamodb:${var.region}:${var.account_id}:table/${var.table_name}"
  - service: DynamoDB
    api: TransactWriteItems
    actions:
      - dynamodb:TransactWriteItems
    resource_arns:
      - "arn:aws:dynamodb:${var.region}:${var.account_id}:table/${var.table_name}"
  - service: DynamoDB
    api: DescribeTable
    actions:
      - dynamodb:DescribeTable
    resource_arns:
      - "arn:aws:dynamodb:${var.region}:${var.account_id}:table/${var.table_name}"
  - service: DynamoDB
    api: CreateTable
